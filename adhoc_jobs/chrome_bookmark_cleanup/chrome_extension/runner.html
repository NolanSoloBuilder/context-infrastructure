<!doctype html>
<meta charset="utf-8">
<title>Codex Bookmark Organizer</title>
<style>
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 24px;
    max-width: 900px;
  }
  pre {
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 16px;
    white-space: pre-wrap;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
</style>
<h1>Codex Bookmark Organizer</h1>
<p>Select the private <code>bookmark_plan.json</code> generated by <code>organize_chrome_bookmarks.js</code>.</p>
<div class="controls">
  <input id="plan-file" type="file" accept="application/json,.json">
  <button id="run" type="button">Run organizer</button>
</div>
<pre id="status">Waiting for a local plan file.</pre>
<script src="runner.js"></script>
